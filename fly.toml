# Narrative — Fly.io app config for alpha hosting.
#
# `app` is a placeholder; fly launch will replace it with whatever name you
# pick during the interactive setup. If you're editing this manually before
# running fly launch, change the app name to something unique.
#
# Primary region: pick whatever's closest to your alpha testers. "iad"
# (Ashburn, VA — US East) is a sensible default; "lhr" (London), "sjc"
# (San Jose), "sin" (Singapore), "syd" (Sydney) are all reasonable.

app = "narrative-alpha"
primary_region = "iad"

[build]
  # No buildpacks — we have an explicit Dockerfile.

[http_service]
  internal_port = 8000
  force_https = true
  # v203 (autostop fix): previously auto_stop_machines = "stop" with
  # min_machines_running = 0 — meant for bursty short-request workloads.
  # Wrong choice for Narrative because /api/synthesize/segments/stream
  # is a long-running SSE response (book-chapter synth can take 2-5
  # minutes on shared CPU). Fly's autostopper doesn't count an active
  # SSE response as "busy" — only new HTTP requests in the recent
  # window — so it SIGINTed the Python process mid-synth on 2026-05-30,
  # killing a phone user's chapter_00 job after 7 minutes of progress.
  # min_machines_running = 1 keeps one machine alive 24/7; autostop
  # stays off so a long synth job never gets cut off again. Cost: one
  # ~$5/mo shared-CPU machine continuously vs the previous near-zero
  # idle cost. Acceptable for alpha.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    # Hit the static index — `/api/voices` would require X-Narrative-Key
    # once that secret is set, and Fly's healthcheck can't send it.
    path = "/"

[[vm]]
  # Piper synthesis is CPU-bound + needs ~500-800 MB during inference.
  # 1 GB RAM was enough until testers started loading multiple voices
  # at once (each cached .onnx is 150-200 MB). 2026-05-31: OOM-killed
  # mid-GitHub-fetch when a tester had two voices cached + an active
  # synth + a fetch arriving concurrently — total RSS hit 877 MB which
  # is past the safe ceiling at 1 GB. Bumped to 2 GB.
  #
  # If synthesis feels slow, bump cpus to 2 first; bumping memory only
  # helps when the symptom is OOM (not throughput).
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[env]
  # NARRATIVE_KEY is NOT set here. Set it via:
  #   fly secrets set NARRATIVE_KEY=...
  # That way the actual secret never lands in version control.
