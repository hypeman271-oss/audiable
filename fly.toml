# Narrative — Fly.io app config for alpha hosting.
#
# `app` is a placeholder; fly launch will replace it with whatever name you
# pick during the interactive setup. If you're editing this manually before
# running fly launch, change the app name to something unique.
#
# Primary region: pick whatever's closest to your alpha testers. "iad"
# (Ashburn, VA — US East) is a sensible default; "lhr" (London), "sjc"
# (San Jose), "sin" (Singapore), "syd" (Sydney) are all reasonable.

app = "narrative-alpha"
primary_region = "iad"

[build]
  # No buildpacks — we have an explicit Dockerfile.

[http_service]
  internal_port = 8000
  force_https = true
  # Spin the machine DOWN when idle (alpha traffic is bursty: someone
  # uses it for 20 min, then nobody for hours). Fly only bills for
  # time the machine is running. First request after idle takes
  # ~5-10s as the machine spins up — acceptable for alpha.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    # Hit the static index — `/api/voices` would require X-Narrative-Key
    # once that secret is set, and Fly's healthcheck can't send it.
    path = "/"

[[vm]]
  # Piper synthesis is CPU-bound + needs ~500-800 MB during inference.
  # 1 GB RAM + a shared CPU is plenty for alpha (1-10 concurrent users).
  # If synthesis feels slow, bump cpus to 2 first; bumping memory rarely
  # helps for TTS.
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[env]
  # NARRATIVE_KEY is NOT set here. Set it via:
  #   fly secrets set NARRATIVE_KEY=...
  # That way the actual secret never lands in version control.
