# Tauri desktop release pipeline (#708).
#
# Builds Narrative for Windows + macOS + Linux on the appropriate
# runners, signs the Tauri updater artifacts so existing installs
# can auto-update, and attaches everything to a single GitHub Release.
#
# Why this exists: the Tauri Bundler can emit MSI/NSIS/DMG/AppImage
# straight from `cargo tauri build`, BUT only on the right OS for
# each format. Our dev machine is Windows-only — we can build MSI +
# NSIS locally but never DMG. GitHub Actions provides macos-latest
# runners for free, which closes the gap.
#
# Architecture: two-phase. The `build` matrix produces platform-
# specific bundles + .sig files and uploads them as workflow
# artifacts. The `release` job then downloads all of them and
# creates a single GitHub Release with every binary attached.
# This avoids a race condition we hit in v4.49 where matrix jobs
# each tried to create the same Release concurrently — one job's
# artifacts uploaded, the rest got lost.
#
# Triggers:
#   - push of a `v*` tag (eg. `git tag v0.1.1 && git push origin v0.1.1`)
#   - manual via "Run workflow" button in the Actions tab
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY            — contents of narrative-updater.key
#                                          (paste the file body as-is)
#
# Optional secrets (only needed once Apple Dev + Windows code-sign
# certs are in hand — see #214):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD

name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1). Used as the release name."
        required: true
        default: "v0.0.0-dev"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: "macos-arm64"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: "macos-x64"
          - platform: ubuntu-22.04
            args: ""
            label: "linux"
          - platform: windows-latest
            args: ""
            label: "windows"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # #866: this action runs in two phases — MAIN restores the cache
      # before the build (fast happy path), and POST saves it after the
      # build (so the next run has a warm cache). The POST phase has
      # been observed to fail intermittently on tar/zstd compression
      # or the upload to GHA cache storage. When it fails, the JOB's
      # conclusion is marked "failure" even though the actual bundles
      # built + uploaded successfully — which then skips the release
      # job's `needs: build` gate, blocking the GitHub Release.
      #
      # `continue-on-error: true` makes BOTH the main and post phases
      # non-fatal — a cache failure becomes a perf hit (no warm cache
      # next run) instead of a release-blocker. Hit us once in
      # workflow 27114700314 (v0.1.3); we worked around by manually
      # downloading the artifacts + creating the release with gh CLI.
      # Don't want to do that twice.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build-only mode: tauri-action without tagName/releaseName
      # arguments. The action runs `cargo tauri build` and signs the
      # updater artifacts, but doesn't touch the GitHub Release —
      # that's the next job's responsibility.
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          # Tauri updater signing — required for auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OS code-sign env vars deliberately absent here — see the
          # extended comment in the v4.49 commit history. Empty-string
          # APPLE_CERTIFICATE makes the bundler call `security import`
          # on garbage data and crash. The tauri.conf.json
          # bundle.macOS.signingIdentity = "-" forces ad-hoc signing
          # so we never touch the keychain on macOS runners.
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}

      # Each runner has its own bundle layout — Tauri emits to
      # src-tauri/target/{target}/release/bundle/{format}/. On
      # macOS with --target, that's a target-prefixed path; on
      # Linux + Windows it's just target/release/bundle/. The glob
      # patterns below match all the formats Tauri produces across
      # platforms; `if-no-files-found: ignore` keeps each runner
      # from erroring on formats it didn't produce.
      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narrative-bundles-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/msi/*.msi*
            src-tauri/target/release/bundle/nsis/*.exe*
            src-tauri/target/release/bundle/deb/*.deb*
            src-tauri/target/release/bundle/rpm/*.rpm*
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg*
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg*
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*

  # Single-instance release job that runs after every matrix build
  # has uploaded its bundle artifacts. No race condition because
  # there's only one job creating the release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Merge every narrative-bundles-* artifact into one
          # directory tree. We don't care about the per-platform
          # subdirectory structure — softprops/action-gh-release
          # globs across it.
          pattern: narrative-bundles-*
          merge-multiple: false

      - name: List collected artifacts (sanity check)
        run: find artifacts -type f | sort

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Narrative ${{ github.event.inputs.tag || github.ref_name }}"
          # v4.73: was draft:true so we could add release notes before
          # announcing. But Tauri's auto-updater reads asset URLs of the
          # form /releases/download/v{ver}/{file}, which only resolve once
          # the release is PUBLISHED (drafts use an opaque untagged-* URL
          # that the updater can't predict). v0.1.5 stuck in draft caused
          # the "Update failed: 404 Not Found" symptom on v0.1.4 desktops.
          # Now we publish immediately; tweak the body in place after if
          # you want to add hand-written notes.
          draft: false
          prerelease: false
          body: |
            Desktop binaries for Narrative ${{ github.event.inputs.tag || github.ref_name }}.

            Installers:
            - **Windows**: `.msi` (recommended) or `.exe` (NSIS).
            - **macOS**: `.dmg` for Apple Silicon and Intel. Open and drag Narrative to Applications.
            - **Linux**: `.AppImage` (portable), `.deb` (Debian/Ubuntu), or `.rpm` (RHEL/Fedora).

            The signed `.tar.gz` / `.zip` updater bundles + `.sig` files are also attached;
            those drive the in-app "Check for updates" flow (#707). Do not delete them
            before pasting the `.sig` contents into `DESKTOP_SIGNATURES` in `server.py`.

            Until #214 lands real code-sign certs, the installers are unsigned: macOS
            Gatekeeper will require right-click → Open the first time, and Windows
            SmartScreen will show a "More info → Run anyway" warning. They install fine
            either way.
          files: artifacts/**/*
